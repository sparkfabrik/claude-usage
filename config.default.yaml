# Claude Code Usage Monitor - Default Configuration

api:
  # Enable API polling
  enabled: true
  # Cache older than this (seconds) triggers a new API call
  stale_after: 60
  # OAuth usage endpoint, read first. It consumes no quota and reports
  # model-scoped windows (for example "Opus Weekly") that the rate-limit
  # response headers cannot express. Leave empty for the built-in default.
  usage_endpoint: ""
  # Model used by the fallback poll. That fallback is the old 1-token request,
  # used only when the usage endpoint is unreachable.
  model: claude-haiku-4-5-20251001
  # Only poll when Claude Code is running (default: false)
  # Set true to hold back while Claude Code is closed. The default changed when
  # the usage endpoint made polling free: holding back left readers showing
  # stale numbers for as long as Claude Code stayed closed.
  # Note: --force-poll bypasses both only_when_active and stale_after
  only_when_active: false

display:
  # Show estimated API-equivalent cost
  show_cost: true
  # Time periods to show: today, 7d, 30d, all
  periods:
    - today
    - 7d
    - 30d

colors:
  # Utilization percentage thresholds
  green_below: 80
  orange_below: 90

cache:
  # Override cache file path (default: ~/.cache/claude-code-usage/quota.json)
  # path: /custom/path/quota.json

# Override model pricing (per 1M tokens, USD)
# pricing:
#   claude-opus-4:
#     input: 15.00
#     output: 75.00
#     cache_write: 18.75
#     cache_read: 1.50
